# cfg.lex reads `$...(...)` in state SCRIPTVARS, which takes every byte
# while a parenthesis is open: a `#` or a quote in there is part of the
# variable, never a comment or a string.
socket=udp:127.0.0.1:15999
loadmodule "proto_udp.so"
route {
    $ru = $(ru{re.subst,/;transport=[A-Za-z]*#//g});
    $var(a) = $(var(a){re.subst,/"//g});
    $var(b) = $(var(b){re.subst,/#//g});
    $var(c) = $hdr(X#Y);
    route(after);
}
route[after] {
    exit; # a comment after the variables
}
