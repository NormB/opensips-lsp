log_level = 3
socket = udp:127.0.0.1:5060
loadmodule "tm.so"
loadmodule "sl.so"
modparam("tm", "fr_timeout", 30)
include_file "extra.cfg"
route {
	if ($rm == "INVITE") {
		t_on_failure("missed");
		route(relay);
	}
	$var(x) = $(ru{s.len});
}
route[relay] {
	t_relay();
}
failure_route[missed] {
	sl_send_reply(404, "Not here");
}
