[package]
name = "opensips-lsp"
version = "0.19.0"
edition = "2024"
# Verified by the `msrv` CI job, which builds with exactly this
# toolchain — a declared MSRV nothing checks is a wish, not a fact.
rust-version = "1.94"
description = "Language Server Protocol implementation for the OpenSIPS routing script language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NormB/opensips-lsp"

[dependencies]
dashmap = "6"
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-lsp-server = "0.23"
