[package]
name = "opensips-lsp"
version = "0.6.0"
edition = "2024"
description = "Language Server Protocol implementation for the OpenSIPS routing script language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NormB/opensips-lsp"

[dependencies]
dashmap = "6"
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
