name: OpenSSF Scorecard

# Scorecard grades the repository's supply-chain practice against the
# OpenSSF checks (pinned dependencies, token permissions, branch
# protection, signed releases, dangerous workflow patterns and more)
# and publishes the findings to the Security tab. It reports and never
# fails a build: it measures practice, not the code. The weekly run
# catches what no push changes, such as repository settings.

on:
  branch_protection_rule:
  schedule:
    # Mondays 07:20 UTC, off the hour.
    - cron: '20 7 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      # upload the findings to code scanning
      security-events: write
      # publish the score to the OpenSSF API
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      # code scanning ages alerts out; the raw result is kept beside it
      - name: Keep the result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90
          if-no-files-found: error
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
