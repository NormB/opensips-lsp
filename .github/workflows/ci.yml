name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: build deps for the proof environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex libssl-dev pkg-config
      - name: provision the real OpenSIPS tree and binary
        # a skipped test is a failed test here, so the suite refuses to
        # run without this; the same script is what a human runs
        run: scripts/proof-env.sh
      - name: tests (unit + integration + stdio e2e + proofs)
        run: cargo test --all-targets
      - name: rustdoc (missing docs are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  client:
    name: VS Code client (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install
      - run: npm run compile

  grammar:
    name: tree-sitter grammar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tree-sitter-opensips
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npx --yes tree-sitter-cli@0.26 generate
      - run: npx --yes tree-sitter-cli@0.26 test

  # Aggregate gate for branch protection: one required context.
  ci-success:
    name: CI success
    needs: [rust, client, grammar]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all CI jobs green"
