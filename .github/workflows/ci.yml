name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt (the pinned nightly that scripts/fmt.sh names)
        # rustfmt.toml uses unstable options, so formatting needs a nightly
        # rustfmt; the script names it, so the pin lives in one place
        run: |
          rustup toolchain install "$(scripts/fmt.sh toolchain)" --profile minimal --component rustfmt
          scripts/fmt.sh check
      - name: clippy (warnings are errors)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: build deps for the proof environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex libssl-dev pkg-config
      - name: provision the real OpenSIPS tree and binary
        # a skipped test is a failed test here, so the suite refuses to
        # run without this; the same script is what a human runs
        run: scripts/proof-env.sh
      - name: tests (unit + integration + stdio e2e + proofs)
        run: cargo test --all-targets
      - name: rustdoc (missing docs are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  client:
    name: VS Code client (tsc + behaviour)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      # `ci` installs exactly the locked tree and fails if the lock
      # and the manifest disagree; `install` would quietly resolve
      # something else
      - run: npm ci
      - run: npm run compile
      # what the extension DOES: `tsc` cannot see whether an included
      # fragment is actually re-associated, whether an untrusted folder
      # is denied a checker to run, or whether a runtime toggle
      # restarts the server when it should not — and the Rust gate can
      # only see that the strings are there
      - run: npm test
      # the same command `release.yml` packages with. `tsc` and the
      # behaviour suites both pass on a manifest `vsce` will refuse —
      # `@types/vscode` above `engines.vscode` is the one that bit us —
      # and without this step the refusal first appears on a pushed tag,
      # after the release job has already built the server artefacts.
      - run: npx --yes @vscode/vsce package --out /tmp/ci-package-check.vsix

  grammar:
    name: tree-sitter grammar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tree-sitter-opensips
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npx --yes tree-sitter-cli@0.26 generate
      - run: npx --yes tree-sitter-cli@0.26 test

  grammar-sanitizers:
    name: tree-sitter grammar under ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: build deps for the proof environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex libssl-dev pkg-config
      - name: provision the OpenSIPS trees whose .cfg files are parsed
        run: scripts/proof-env.sh
      # scanner.c and parser.c are C that editors compile and load.  A
      # check that cannot fail proves nothing, so the job first plants a
      # one-byte out-of-bounds read and a signed overflow in a copy of
      # scanner.c and requires each stage to report both.
      - name: the sanitizers catch a fault planted in a copy of scanner.c
        run: scripts/grammar-sanitize.sh plant tree-sitter-opensips tests/grammar
      - name: corpus tests and every shipped and fixture .cfg under ASan and UBSan
        run: |
          # one argument per pinned tree: OPENSIPS_LSP_TEST_TREES is <version>=<path>,...
          mapfile -t trees < <(echo "$OPENSIPS_LSP_TEST_TREES" | tr ',' '\n' | cut -d= -f2)
          scripts/grammar-sanitize.sh check tree-sitter-opensips tests/grammar tree-sitter-opensips/test "${trees[@]}"

  audit:
    name: Advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # dependabot opens PRs; it does not fail a build.  A dependency
      # that grows an advisory between bumps should stop the line here
      # rather than wait to be noticed.
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read the declared MSRV
        id: msrv
        run: echo "v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the manifest claims this version compiles the crate; this is
      # what makes that a fact rather than a hope
      - run: cargo check --all-targets

  actionlint:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint checks the `run:` scripts through shellcheck, and
      # skips those checks, and passes, when shellcheck is missing
      - name: shellcheck is present
        run: command -v shellcheck && shellcheck --version
      - name: install actionlint 1.7.12, pinned by sha256
        run: |
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
      # no file list: every workflow under .github/workflows
      - name: actionlint
        run: ./actionlint -color

  fuzz-targets:
    name: list the fuzz targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # read from fuzz/Cargo.toml, so a new target runs here with no list
      # to keep in step
      - id: list
        run: |
          set -euo pipefail
          targets="$(scripts/fuzz.sh list | python3 -I -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: fuzz-targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    env:
      CARGO_FUZZ_VERSION: '0.13.2'
      CARGO_FUZZ_SHA256: 'b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # fuzz/rust-toolchain.toml names the nightly the sanitizer needs
      - name: install the fuzz toolchain and cargo-fuzz
        run: |
          set -euo pipefail
          (cd fuzz && rustup toolchain install)
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 -o cargo-fuzz.tar.gz \
            "https://github.com/rust-fuzz/cargo-fuzz/releases/download/${CARGO_FUZZ_VERSION}/cargo-fuzz-${CARGO_FUZZ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_FUZZ_SHA256}  cargo-fuzz.tar.gz" | sha256sum -c -
          tar xzf cargo-fuzz.tar.gz -C "$HOME/.cargo/bin" cargo-fuzz
          rm -f cargo-fuzz.tar.gz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz -> target
      - name: run for 60 seconds from the seeds
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/fuzz.sh run "$TARGET" 60
      # a target that cannot find a panic planted in the code it reads
      # proves nothing by finding none
      - name: plant a panic where the target reads; the target must find it
        env:
          TARGET: ${{ matrix.target }}
        run: PLANT_SECONDS=300 scripts/fuzz.sh plant "$TARGET"
      # a crash input is kept for 7 days, to be turned into a regression
      # test; it is never committed as it is
      - name: keep the crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 7
          if-no-files-found: ignore

  # Aggregate gate for branch protection: one required context.
  ci-success:
    name: CI success
    needs: [rust, client, grammar, grammar-sanitizers, audit, msrv, actionlint, fuzz]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all CI jobs green"
