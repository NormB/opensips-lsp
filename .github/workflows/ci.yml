name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: tests (unit + integration + stdio e2e)
        run: cargo test --all-targets
      - name: rustdoc (missing docs are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  client:
    name: VS Code client (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install
      - run: npm run compile

  # Aggregate gate for branch protection: one required context.
  ci-success:
    name: CI success
    needs: [rust, client]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all CI jobs green"
