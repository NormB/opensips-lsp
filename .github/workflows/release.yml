name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; the one job that creates the GitHub release
# asks for write in its own block.
permissions:
  contents: read

jobs:
  verify:
    # The tag is what publishes, and nothing checked that it agrees
    # with the tree it points at. A tag one minor ahead of the source
    # would build the OLD version's artefacts, publish them under the
    # new tag, and repoint `/releases/latest` — which is what
    # `install.sh` resolves — at a release whose contents are a
    # version behind its own name.
    name: Tag matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag, Cargo.toml, package.json, fuzz/Cargo.lock and the changelog agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate=$(python3 - <<'EOF'
          import re, pathlib
          text = pathlib.Path("Cargo.toml").read_text()
          pkg = text.split("[package]", 1)[1].split("\n[", 1)[0]
          print(re.search(r'^version = "([^"]+)"', pkg, re.M).group(1))
          EOF
          )
          ext=$(python3 -c "import json;print(json.load(open('client/package.json'))['version'])")
          # the fuzz package depends on the server by path, so its lock
          # file records the server's version too
          fuzz=$(python3 -I -c "import re;print(re.search(r'name = \"opensips-lsp\"\nversion = \"([^\"]+)\"', open('fuzz/Cargo.lock').read()).group(1))")
          echo "tag=$tag crate=$crate extension=$ext fuzz-lock=$fuzz"
          [ "$tag" = "$crate" ] || { echo "::error::tag $tag != Cargo.toml $crate"; exit 1; }
          [ "$tag" = "$ext" ]   || { echo "::error::tag $tag != package.json $ext"; exit 1; }
          [ "$tag" = "$fuzz" ]  || { echo "::error::tag $tag != fuzz/Cargo.lock $fuzz"; exit 1; }
          grep -q "^## \[$tag\]" client/CHANGELOG.md || {
            echo "::error::client/CHANGELOG.md has no '## [$tag]' entry — the marketplace Changes tab would be stale"
            exit 1
          }

  server:
    name: Server (${{ matrix.arch }})
    needs: [verify]
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: linux-gnu
            runner: ubuntu-latest
          - arch: aarch64
            os: linux-gnu
            runner: ubuntu-24.04-arm
          - arch: aarch64
            os: darwin
            runner: macos-14
          - arch: x86_64
            os: darwin
            runner: macos-14
            # GitHub retired the Intel macos-13 runners; cross-compile
            # the x86_64 slice on the arm64 runner instead
            target: x86_64-apple-darwin
          - arch: x86_64
            os: windows
            runner: windows-latest
          - arch: aarch64
            os: windows
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build and package
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target "${{ matrix.target }}"
            BINDIR="target/${{ matrix.target }}/release"
          else
            cargo build --release
            BINDIR="target/release"
          fi
          if [ "${{ matrix.os }}" = "windows" ]; then
            # zip: what Windows users (and Explorer) expect
            7z a -tzip \
              "opensips-lsp-${GITHUB_REF_NAME}-${{ matrix.arch }}-windows.zip" \
              "./$BINDIR/opensips-lsp.exe" >/dev/null
          else
            tar -C "$BINDIR" -czf \
              "opensips-lsp-${GITHUB_REF_NAME}-${{ matrix.arch }}-${{ matrix.os }}.tar.gz" \
              opensips-lsp
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.arch }}-${{ matrix.os }}
          path: |
            opensips-lsp-*.tar.gz
            opensips-lsp-*.zip

  vsix:
    name: VS Code extension (platform builds)
    needs: [server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - name: Package platform + universal builds
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npm run compile
          # platform builds carry the matching server binary
          for triple in "linux-x64 x86_64 linux-gnu" "linux-arm64 aarch64 linux-gnu" \
                        "darwin-arm64 aarch64 darwin" "darwin-x64 x86_64 darwin" \
                        "win32-x64 x86_64 windows" "win32-arm64 aarch64 windows"; do
            read -r target arch os <<<"$triple"
            rm -rf server && mkdir server
            if [ "$os" = "windows" ]; then
              unzip -q -d server \
                "../dist/opensips-lsp-${GITHUB_REF_NAME}-${arch}-windows.zip"
            else
              tar -C server -xzf \
                "../dist/opensips-lsp-${GITHUB_REF_NAME}-${arch}-${os}.tar.gz"
            fi
            npx --yes @vscode/vsce package --target "$target" --out \
              "opensips-lsp-ext-${GITHUB_REF_NAME}-${target}.vsix"
          done
          # universal build: no binary, PATH/setting fallback
          rm -rf server
          npx --yes @vscode/vsce package --out \
            "opensips-lsp-ext-${GITHUB_REF_NAME}.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: client/*.vsix

  openvsx:
    name: Open VSX
    needs: [vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          # A release that quietly publishes nothing is worse than one
          # that fails: the tag is cut, the GitHub assets are up, and
          # every installer still resolves to the previous version
          # with a green tick above it saying otherwise.
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT is not set, so nothing can be published"
            echo "The GitHub release is complete; only the Open VSX half"
            echo "is missing.  Set the secret and re-run this job."
            exit 1
          fi
          # Publisher, name and version all read from the packaged
          # manifest, so they cannot drift from what was actually
          # built.  The namespace is needed for a first publish and is
          # idempotent afterwards.
          read -r NS NAME VERSION <<<"$(python3 -c "import zipfile,json,glob; \
            m=json.loads(zipfile.ZipFile(sorted(glob.glob('*.vsix'))[0]).read('extension/package.json')); \
            print(m['publisher'], m['name'], m['version'])")"
          echo "publishing $NS.$NAME $VERSION"
          npx --yes ovsx create-namespace "$NS" -p "$OVSX_PAT" || true
          for f in *.vsix; do
            rc=0
            out=$(npx --yes ovsx publish "$f" -p "$OVSX_PAT" 2>&1) || rc=$?
            echo "$out"
            if [ $rc -ne 0 ]; then
              # a rerun of an already-accepted publish is not a failure
              echo "$out" | grep -q "already published" || exit 1
              echo "skipping $f (already published)"
              continue
            fi
            # `ovsx` exits 0 having uploaded something; make it say it
            # uploaded THIS version, so a packaging slip that ships the
            # previous one cannot pass as a release
            echo "$out" | grep -q "$VERSION" || {
              echo "::error::publish of $f reported success without naming $VERSION"
              exit 1
            }
          done

          # Uploaded is not installable.  The registry indexes
          # asynchronously, and each platform build separately: after
          # every target logged "Published", some returned 404 for the
          # version for up to about an hour.  Until a target is served,
          # `install.sh` and every editor on that platform still offer
          # the previous version.  Wait for all of them.
          echo "waiting for the registry to serve $NS.$NAME $VERSION"
          pending="universal linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64"
          for _ in $(seq 1 270); do
            left=""
            for target in $pending; do
              if [ "$target" = universal ]; then
                url="https://open-vsx.org/api/$NS/$NAME/$VERSION"
              else
                url="https://open-vsx.org/api/$NS/$NAME/$target/$VERSION"
              fi
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              [ "$code" = "200" ] || left="$left $target"
            done
            pending="${left# }"
            if [ -z "$pending" ]; then
              echo "every target visible after $SECONDS seconds"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$VERSION was accepted but is still not served after 90 minutes for: $pending"
          echo "The GitHub release is complete and the upload was accepted;"
          echo "this is the registry not indexing it.  Check"
          echo "https://open-vsx.org/extension/$NS/$NAME before re-running."
          exit 1

  publish:
    name: GitHub release
    needs: [server, vsix]
    runs-on: ubuntu-latest
    # creates the release and uploads its assets
    permissions:
      contents: write
      # Sigstore signs with a short-lived certificate for this job's OIDC
      # identity; the attestation is stored with the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      # OpenSSF Scorecard's Signed-Releases check reads only the asset
      # names of the last five releases: it wants a signature
      # (*.sigstore.json among others) and provenance (*.intoto.jsonl).
      # Both are made here from this job's OIDC identity, with no stored
      # key, and tests/release_signing_test.rs holds the wiring in place.
      - name: Write the checksums
        run: |
          set -euo pipefail
          sha256sum -- opensips-lsp-*.tar.gz opensips-lsp-*.zip ./*.vsix > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            opensips-lsp-*.tar.gz
            opensips-lsp-*.zip
            *.vsix
            SHA256SUMS.txt
      - name: Keep the provenance bundle as a release asset
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$PROVENANCE_BUNDLE" "opensips-lsp-${GITHUB_REF_NAME}.intoto.jsonl"
      # The installer checks the cosign binary against a digest pinned in
      # the action itself; v3.0.6 is the version that digest names.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign the checksum list
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.txt.sigstore.json \
            SHA256SUMS.txt
      # The commands SECURITY.md gives users, before the release exists,
      # so a file that does not verify fails the job instead of shipping.
      - name: Verify the signature and the provenance file
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle SHA256SUMS.txt.sigstore.json \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS.txt
          gh attestation verify SHA256SUMS.txt \
            --bundle "opensips-lsp-${GITHUB_REF_NAME}.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          sha256sum -c SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # rerun: refresh the assets on the existing release
            gh release upload "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" --clobber \
              ./opensips-lsp-*.tar.gz ./opensips-lsp-*.zip ./*.vsix \
              ./SHA256SUMS.txt ./SHA256SUMS.txt.sigstore.json ./*.intoto.jsonl
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              ./opensips-lsp-*.tar.gz ./opensips-lsp-*.zip ./*.vsix \
              ./SHA256SUMS.txt ./SHA256SUMS.txt.sigstore.json ./*.intoto.jsonl
          fi
